# Builds the Elo Ladder iPhone app on a GitHub-hosted Mac.
#
# Every run compiles the app for the iPhone simulator (proves it builds).
# Once these repository secrets exist, it also signs the app and uploads it
# to App Store Connect (TestFlight, then App Store review):
#   APPLE_TEAM_ID           10-character Team ID from developer.apple.com
#   APPSTORE_KEY_ID         App Store Connect API key ID
#   APPSTORE_ISSUER_ID      App Store Connect API issuer ID
#   APPSTORE_P8_BASE64      the downloaded AuthKey_XXXX.p8, base64-encoded
#
# Run it from the Actions tab ("Run workflow"), or push a tag like ios-v1.
#
# "target: phone" instead makes an ad hoc build for the iPhones registered in
# the developer account (Devices), attaches it to a GitHub release named
# phone-build-N, and prints the itms-services install link. Only registered
# phones can install it.

name: iOS app

on:
  workflow_dispatch:
    inputs:
      target:
        description: "app-store = upload to App Store Connect; phone = install straight onto registered iPhones"
        type: choice
        options: [app-store, phone]
        default: app-store
  push:
    tags: ["ios-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HAS_SIGNING: ${{ secrets.APPSTORE_KEY_ID != '' && secrets.APPSTORE_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode (Apple requires the iOS 26 SDK)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Capacitor
        run: npm ci

      - name: Prepare the web app
        run: npm run build:web

      - name: Create the iOS project
        run: npx cap add ios --packagemanager SPM

      - name: App icons and launch screens
        run: npx capacitor-assets generate --ios --iconBackgroundColor '#14161b' --splashBackgroundColor '#0b0d18' --splashBackgroundColorDark '#0b0d18'

      - name: Copy the web app into the iOS project
        run: npx cap sync ios

      - name: App settings (name, portrait on iPhone, no export paperwork)
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Elo Ladder" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Elo Ladder" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          echo "APP_VERSION=1.$(node -p "require('./version.json').version").0" >> "$GITHUB_ENV"

      - name: Build for the simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            TARGETED_DEVICE_FAMILY=1 CODE_SIGNING_ALLOWED=NO build | tail -n 25

      - name: Sign and upload to App Store Connect (or make a phone build)
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_P8_BASE64: ${{ secrets.APPSTORE_P8_BASE64 }}
          TARGET: ${{ inputs.target || 'app-store' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$TARGET" = "phone" ]; then METHOD=release-testing; DEST=export; else METHOD=app-store-connect; DEST=upload; fi
          KEY="$RUNNER_TEMP/AuthKey_$APPSTORE_KEY_ID.p8"
          echo "$APPSTORE_P8_BASE64" | base64 --decode > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$APPSTORE_KEY_ID" -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic TARGETED_DEVICE_FAMILY=1 \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" "${AUTH[@]}" | tail -n 25
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$METHOD</string>
            <key>destination</key><string>$DEST</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY"
          if [ "$TARGET" != "phone" ]; then
            echo "Uploaded Elo Ladder $APP_VERSION (build ${{ github.run_number }}) to App Store Connect."
            exit 0
          fi
          # Phone build: attach the .ipa and an install manifest to a release
          TAG="phone-build-${{ github.run_number }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          mv "$RUNNER_TEMP"/export/*.ipa "$RUNNER_TEMP/EloLadder.ipa"
          cat > "$RUNNER_TEMP/manifest.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>items</key><array><dict>
            <key>assets</key><array><dict>
              <key>kind</key><string>software-package</string>
              <key>url</key><string>$BASE/EloLadder.ipa</string>
            </dict></array>
            <key>metadata</key><dict>
              <key>bundle-identifier</key><string>io.github.kaceiam.eloladder</string>
              <key>bundle-version</key><string>$APP_VERSION</string>
              <key>kind</key><string>software</string>
              <key>title</key><string>Elo Ladder</string>
            </dict>
          </dict></array></dict></plist>
          EOF
          LINK="itms-services://?action=download-manifest&url=$BASE/manifest.plist"
          gh release create "$TAG" "$RUNNER_TEMP/EloLadder.ipa" "$RUNNER_TEMP/manifest.plist" \
            --prerelease --title "Phone test build ${{ github.run_number }}" \
            --notes "Test build for registered iPhones only (it won't install on any other phone). Install link, open in Safari on the iPhone: $LINK"
          echo "INSTALL LINK: $LINK"
