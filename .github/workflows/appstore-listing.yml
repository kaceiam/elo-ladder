# Fills in the App Store page (text, categories, screenshots, build, review
# notes) from appstore/metadata.json using the App Store Connect API key.
# It never submits the app for review.

name: App Store listing

on:
  workflow_dispatch:

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fill in the App Store page
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_P8_BASE64: ${{ secrets.APPSTORE_P8_BASE64 }}
        run: |
          export APPSTORE_KEY_PATH="$RUNNER_TEMP/key.p8"
          printf %s "$APPSTORE_P8_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 --decode > "$APPSTORE_KEY_PATH"
          export APPSTORE_KEY_ID="$(printf %s "$APPSTORE_KEY_ID" | tr -cd 'A-Z0-9')"
          export APPSTORE_ISSUER_ID="$(printf %s "$APPSTORE_ISSUER_ID" | tr -cd 'a-f0-9-')"
          node tools/asc-fill.mjs
          rm -f "$APPSTORE_KEY_PATH"
